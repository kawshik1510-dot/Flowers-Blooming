<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise 💖</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 1. PIN Lock Screen -->
    <div id="pin-screen" class="screen">
        <div class="pin-card">
            <div class="lock-icon">🔒</div>
            <h2>Enter Secret PIN</h2>
            <p>Enter the 6-digit code to unlock</p>
            <input type="password" id="pin-input" maxlength="6" placeholder="••••••" autofocus>
            <button onclick="checkPin()">Unlock</button>
            <p id="error-msg" class="error"></p>
        </div>
    </div>

    <!-- 2. Letter & Bouquet Container -->
    <div id="main-content" class="hidden">
        
        <!-- Letter Section -->
        <section class="letter-section">
            <div class="paper">
                <div class="heart-stamp">💖</div>
                <div id="typewriter-text" class="letter-text"></div>
                <button id="show-flower-btn" class="hidden-btn" onclick="scrollToBouquet()">
                    See Your Surprise Flowers 🌸
                </button>
            </div>
        </section>

        <!-- Bouquet Section -->
        <section id="bouquet-section" class="bouquet-section">
            <div class="flower-card">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1aWsxcW1yeXBpY3p2bGt2aXlsbm44bThic3BicXdpdWlmdnU5NyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Lq0h93752f6J9tijrh/giphy.gif" alt="Flowers Bouquet" class="flower-img">
                <h2>Flowers For You! 💐</h2>
                <p>Because you deserve all the sweetness in the world! ❤️</p>
            </div>
        </section>

    </div>

    <script src="srcipt.js"></script>
</body>
</html>
